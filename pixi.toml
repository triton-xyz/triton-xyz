[workspace]
authors = ["Allen Guo <guosonglin001@gmail.com>"]
channels = ["conda-forge"]
name = "triton-xyz"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.5,<3.15"
uv = ">=0.11.19,<0.12"
ruff = ">=0.15.15,<0.16"
ty = ">=0.0.43,<0.0.44"
debugpy = ">=1.8.21,<2"

pre-commit = ">=4.6.0,<5"
pytest = ">=9.0.3,<10"
lit = ">=22.1.7,<23"

pytorch = ">=2.11.0,<3"
pybind11 = ">=3.0.1,<4"
pybind11-global = ">=3.0.1,<4"

scipy = ">=1.17.1,<2"
nlohmann_json = "3.11.3.*"

[pypi-dependencies]
llnl-hatchet = ">=2026.1.0, <2027"

[activation.env]
# needs llvm-triton
TRITON_XYZ_PATH_0 = "${PIXI_PROJECT_ROOT}/llvm-triton/llvm-project/build/bin"
TRITON_XYZ_PATH_1 = "${PIXI_PROJECT_ROOT}/build/bin"
PATH = "${TRITON_XYZ_PATH_1}:${TRITON_XYZ_PATH_0}:${PATH}"

[target.osx-arm64.activation.env]
# lld is installed globaly, always prefer lld on osx
# `llnl-hatchet` needs lld
LDFLAGS = "-fuse-ld=lld"
